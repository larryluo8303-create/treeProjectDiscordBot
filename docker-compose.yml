version: "3.8"

services:
  bot:
    build: .
    env_file: .env
    ports:
      # Both sides follow API_PORT (default 8090): the app listens on
      # API_PORT inside the container (see bot/api/server.py).
      - "${API_PORT:-8090}:${API_PORT:-8090}"
    volumes:
      - ./chromadb_store:/app/chromadb_store
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
